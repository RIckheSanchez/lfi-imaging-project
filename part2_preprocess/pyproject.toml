[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thz_preprocessing"
version = "0.6.0"
description = "Signal pre-processing module for THz LFI skin imaging data"
authors = [{ name = "Haobo Yu" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "h5py>=3.8",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
demo = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# vendor/data_import ships its own script-style tests with machine-specific paths.
testpaths = ["tests"]
